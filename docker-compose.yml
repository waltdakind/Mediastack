services:

  api-gateway:
    build: ./api-gateway
    image: mediastack-api-gateway:latest
    container_name: api-gateway
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./api-gateway/index.js:/app/index.js:ro
      - ./certs:/certs:ro
    restart: unless-stopped
    labels:
      - "autoheal=true"

  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
      - "444:444"
      - "8097:8097"
      - "8990:8990"
      - "7879:7879"
      - "9697:9697"
      - "6768:6768"
      - "5056:5056"
      - "9092:9092"
      - "8081:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - ./config/caddy_data:/data
      - ./config/caddy_config:/config
      - ./dashboard:/var/www/dashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "autoheal=true"

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
      - JELLYFIN_DATA_DIR=/config/data
      - JELLYFIN_CONFIG_DIR=/config
      - JELLYFIN_LOG_DIR=/config/log
      - JELLYFIN_CACHE_DIR=/config/cache
      - JELLYFIN_WEB_DIR=/usr/share/jellyfin/web
    volumes:
      - ./config/jellyfin:/config
      - ./certs:/certs:ro
      - ${MEDIA_DIR}:/data
    ports:
      - "8096:8096"
      - "8920:8920"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./config/seerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped
    labels:
      - "autoheal=true"
    networks:
      default:
        aliases:
          - jellyseerr
          - seerr

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./config/sonarr:/config
      - ${MEDIA_DIR}:/data
    ports:
      - "8989:8989"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    labels:
      - "autoheal=true"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./config/radarr:/config
      - ${MEDIA_DIR}:/data
    ports:
      - "7878:7878"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    labels:
      - "autoheal=true"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    labels:
      - "autoheal=true"

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./config/bazarr:/config
      - ${MEDIA_DIR}:/data
    ports:
      - "6767:6767"
    restart: unless-stopped
    labels:
      - "autoheal=true"

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./transmission/config:/config
      - ${MEDIA_DIR}:/data
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    restart: unless-stopped
    labels:
      - "autoheal=true"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
      - WEBUI_PORT=8085
      - TORRENTING_PORT=6881
    volumes:
      - ./config/qbittorrent:/config
      - ${MEDIA_DIR}:/data
    ports:
      - "8085:8085"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    labels:
      - "autoheal=true"

  mediastack-db:
    image: coleifer/sqlite-web
    container_name: mediastack-db
    ports:
      - "8080:8080"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
      - SQLITE_DATABASE=mediastack_backup.db
    volumes:
      - ./config/db-backup:/config
      - ./config:/mediastack/config:ro
      - ./db-backup:/db-backup
    command: sqlite_web -H 0.0.0.0 -p 8080 /config/mediastack_backup.db
    restart: unless-stopped
    labels:
      - "autoheal=true"

  tvheadend:
    image: lscr.io/linuxserver/tvheadend:latest
    container_name: tvheadend
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./config/tvheadend:/config
      - ${MEDIA_DIR}:/data
    ports:
      - "9981:9981"
      - "9982:9982"
    restart: unless-stopped
    labels:
      - "autoheal=true"

  diun:
    image: crazymax/diun:latest
    container_name: diun
    command: serve
    volumes:
      - ./config/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ:-America/New_York}
      - LOG_LEVEL=info
      - LOG_JSON=false
      - DIUN_WATCH_WORKERS=5
      - DIUN_WATCH_SCHEDULE=0 0 * * *
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=false
    ports:
      - "9090:9090"
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/portainer:/data
    restart: unless-stopped

  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    restart: unless-stopped
    ports:
      - "8265:8265"
      - "8266:8266"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
      - serverIP=localhost
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - nodeID=MediaStackNode
    volumes:
      - ./config/tdarr/server:/app/server
      - ./config/tdarr/configs:/app/configs
      - ./config/tdarr/logs:/app/logs
      - ${MEDIA_DIR}:/data
      - ./config/tdarr/cache:/temp
    labels:
      - "autoheal=true"



  # =============================================================================
  # MUSICBRAINZ LOCAL DB, SEARCH & MIRROR API STACK (MERGED SERVICES)
  # =============================================================================

  musicbrainz:
    build:
      context: ./musicbrainz-docker/build/musicbrainz-prebuilt
    image: musicbrainz-docker_musicbrainz:latest
    container_name: musicbrainz-docker-musicbrainz-1
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "50"
    ports:
      - "5000:5000"
    volumes:
      - musicbrainz_dbdump:/media/dbdump
      - musicbrainz_solrdump:/var/cache/musicbrainz/solr-backups:ro
    restart: unless-stopped
    env_file:
      - ./musicbrainz-docker/default/postgres.env
    environment:
      - MUSICBRAINZ_BASE_FTP_URL=${MUSICBRAINZ_BASE_FTP_URL:-}
      - MUSICBRAINZ_BASE_DOWNLOAD_URL=${MUSICBRAINZ_BASE_DOWNLOAD_URL:-https://data.metabrainz.org/pub/musicbrainz}
      - MUSICBRAINZ_SERVER_PROCESSES=${MUSICBRAINZ_SERVER_PROCESSES:-10}
      - MUSICBRAINZ_USE_PROXY=1
      - MUSICBRAINZ_WEB_SERVER_HOST=${MUSICBRAINZ_WEB_SERVER_HOST:-localhost}
      - MUSICBRAINZ_WEB_SERVER_PORT=${MUSICBRAINZ_WEB_SERVER_PORT:-5000}
    depends_on:
      - musicbrainz-db
      - musicbrainz-search
      - musicbrainz-valkey

  musicbrainz-secondary:
    image: musicbrainz-docker-musicbrainz:latest
    container_name: musicbrainz-docker-musicbrainz-2
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "50"
    ports:
      - "5001:5000"
    volumes:
      - musicbrainz_dbdump:/media/dbdump
      - musicbrainz_solrdump:/var/cache/musicbrainz/solr-backups:ro
    restart: unless-stopped
    env_file:
      - ./musicbrainz-docker/default/postgres.env
    environment:
      - MUSICBRAINZ_BASE_FTP_URL=${MUSICBRAINZ_BASE_FTP_URL:-}
      - MUSICBRAINZ_BASE_DOWNLOAD_URL=${MUSICBRAINZ_BASE_DOWNLOAD_URL:-https://data.metabrainz.org/pub/musicbrainz}
      - MUSICBRAINZ_SERVER_PROCESSES=${MUSICBRAINZ_SERVER_PROCESSES:-10}
      - MUSICBRAINZ_USE_PROXY=1
      - MUSICBRAINZ_WEB_SERVER_HOST=${MUSICBRAINZ_WEB_SERVER_HOST:-localhost}
      - MUSICBRAINZ_WEB_SERVER_PORT=5000
    depends_on:
      - musicbrainz-db
      - musicbrainz-search
      - musicbrainz-valkey

  musicbrainz-db:
    platform: linux/amd64
    build:
      context: ./musicbrainz-docker/build/postgres-prebuilt
    image: musicbrainz-docker_db:${POSTGRES_VERSION:-18}
    container_name: musicbrainz-docker-db-1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped
    command: postgres -c "shared_buffers=2048MB"
    env_file:
      - ./musicbrainz-docker/default/postgres.env
    shm_size: "2GB"
    volumes:
      - musicbrainz_pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    expose:
      - "5432"
    networks:
      default:
        aliases:
          - db

  musicbrainz-indexer:
    platform: linux/amd64
    build:
      context: ./musicbrainz-docker/build/sir
    image: musicbrainz-docker_indexer:latest
    container_name: musicbrainz-docker-indexer-1
    env_file:
      - ./musicbrainz-docker/default/postgres.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    volumes:
      - ./musicbrainz-docker/default/indexer.ini:/code/config.ini
    restart: unless-stopped
    depends_on:
      - musicbrainz-db
      - musicbrainz-search

  musicbrainz-search:
    platform: linux/amd64
    build:
      context: ./musicbrainz-docker/build/solr
      args:
        - MB_SOLR_VERSION=${MB_SOLR_VERSION:-4.1.0}
    image: musicbrainz-docker_search:${MB_SOLR_VERSION:-4.1.0}
    container_name: musicbrainz-docker-search-1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped
    environment:
      - SOLR_HEAP=2g
      - LOG4J_FORMAT_MSG_NO_LOOKUPS=true
    mem_swappiness: 1
    ports:
      - "8983:8983"
    expose:
      - "8983"
    volumes:
      - musicbrainz_dbdump:/media/dbdump:ro
      - musicbrainz_solrdata:/var/solr
      - musicbrainz_solrdump:/var/cache/musicbrainz/solr-backups
    networks:
      default:
        aliases:
          - search

  musicbrainz-valkey:
    image: valkey/valkey:9-alpine
    container_name: musicbrainz-docker-valkey-2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped
    ports:
      - "6379:6379"
    expose:
      - "6379"
    networks:
      default:
        aliases:
          - valkey

volumes:
  musicbrainz_pgdata:
    name: musicbrainz-docker_pgdata
    external: true
  musicbrainz_solrdata:
    name: musicbrainz-docker_solrdata
    external: true
  musicbrainz_dbdump:
    name: musicbrainz-docker_dbdump
    external: true
  musicbrainz_solrdump:
    name: musicbrainz-docker_solrdump
    external: true
