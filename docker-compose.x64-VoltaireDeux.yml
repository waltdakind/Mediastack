# =============================================================================
# docker-compose.x64.yml â€” MediaStack x64 (Main Server) Services
# =============================================================================
#
# Full stack for the primary x64 server:
#   Caddy        â€” Reverse proxy (subdomain routing, external HTTPS-ready)
#   Jellyfin     â€” Media server (all libraries: music, movies, TV, photos)
#   Prowlarr     â€” Unified indexer manager
#   Radarr       â€” Movie automation
#   Sonarr       â€” TV show automation
#   Transmission â€” BitTorrent client
#   TVHeadend    â€” TV streaming and EPG (host network)
#   Syncthing    â€” Full file sync + Jellyfin theme share for ARM satellites
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.x64.yml up -d
#   â€” OR â€” .\start-x64.ps1
#
# NOTE: YAML anchors must be re-declared per document (YAML spec).
# =============================================================================

# Re-declare anchors (must be in same YAML document to use them)
x-common: &common
  restart: unless-stopped
  networks:
    - medianet

x-env-ls: &env-ls
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-America/New_York}

x-no-ipv6: &no-ipv6
  sysctls:
    net.ipv6.conf.all.disable_ipv6: 1
    net.ipv6.conf.default.disable_ipv6: 1
    net.ipv6.conf.lo.disable_ipv6: 1

services:

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Caddy â€” Reverse proxy (x64: full subdomain routing)
  # Docs: https://caddyserver.com/docs/
  #
  # Routes:
  #   http://{CADDY_DOMAIN}              â†’ Jellyfin
  #   http://radarr.{CADDY_DOMAIN}       â†’ Radarr
  #   http://sonarr.{CADDY_DOMAIN}       â†’ Sonarr
  #   http://prowlarr.{CADDY_DOMAIN}     â†’ Prowlarr
  #   http://transmission.{CADDY_DOMAIN} â†’ Transmission
  #   http://syncthing.{CADDY_DOMAIN}    â†’ Syncthing
  #   http://tvheadend.{CADDY_DOMAIN}    â†’ TVHeadend

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  caddy:
    <<: [*common, *no-ipv6]
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ${MEDIASTACK_ROOT:-C:/Users/Public/Mediastack}:/mediastack
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-media.local}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Jellyfin â€” Full media server (music, movies, TV, photos)
  # x64: Intel iGPU transcoding available (uncomment devices block)
  # Docs: https://jellyfin.org/docs/general/installation/container/
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  jellyfin:
    <<: [*common, *no-ipv6]
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *env-ls
      # Uncomment for DLNA / auto-discovery:
      # JELLYFIN_PublishedServerUrl: https://${CADDY_DOMAIN}
    volumes:
      - ${CONFIG_ROOT:-./config}/jellyfin:/config
      - /dev/shm/jellyfin_cache:/cache          # RAM disk â€” fast, low-wear
      - ${MUSIC_ROOT:-C:/Users/Public/Music}:/data/music:ro
      - //VoltaireUn/Users/Public/Movies:/data/movies:ro
      - //VoltaireUn/Users/Public/Videos:/data/tv:ro
      - //VoltaireUn/Users/Public/Pictures:/data/photos:ro
      - ${MEDIASTACK_ROOT:-C:/Users/Public/Mediastack}:/mediastack
    ports:
      - "8096:8096"
      # Uncomment for DLNA (requires network_mode: host):
      # - "7359:7359/udp"
      # - "1900:1900/udp"
    # Intel iGPU transcoding (DISABLED for Docker Desktop / WSL2):
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "103"
    shm_size: "256mb"
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Prowlarr â€” Unified indexer manager
  # Docs: https://wiki.servarr.com/prowlarr
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  prowlarr:
    <<: [*common, *no-ipv6]
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *env-ls
    volumes:
      - ${CONFIG_ROOT:-./config}/prowlarr:/config
      - ${MEDIASTACK_ROOT:-C:/Users/Public/Mediastack}:/mediastack
    ports:
      - "9696:9696"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Radarr â€” Movie automation
  # Docs: https://wiki.servarr.com/radarr
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  radarr:
    <<: [*common, *no-ipv6]
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *env-ls
    volumes:
      - ${CONFIG_ROOT:-./config}/radarr:/config
      - //VoltaireUn/Users/Public/Movies:/movies
      - ${DOWNLOAD_ROOT:-./downloads}:/downloads
      - ${MEDIASTACK_ROOT:-C:/Users/Public/Mediastack}:/mediastack
    ports:
      - "7878:7878"
    depends_on:
      prowlarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Sonarr â€” TV show automation
  # Docs: https://wiki.servarr.com/sonarr
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  sonarr:
    <<: [*common, *no-ipv6]
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *env-ls
    volumes:
      - ${CONFIG_ROOT:-./config}/sonarr:/config
      - //VoltaireUn/Users/Public/Videos:/tv
      - ${DOWNLOAD_ROOT:-./downloads}:/downloads
      - ${MEDIASTACK_ROOT:-C:/Users/Public/Mediastack}:/mediastack
    ports:
      - "8989:8989"
    depends_on:
      prowlarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Transmission â€” BitTorrent client
  # Docs: https://docs.linuxserver.io/images/docker-transmission/
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  transmission:
    <<: [*common, *no-ipv6]
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      <<: *env-ls
      USER: ${TRANSMISSION_USER:-admin}
      PASS: ${TRANSMISSION_PASS:-changeme}
    volumes:
      - ${CONFIG_ROOT:-./config}/transmission:/config
      - ${DOWNLOAD_ROOT:-./downloads}:/downloads
      - ${DOWNLOAD_ROOT:-./downloads}/watch:/watch
      - ${MEDIASTACK_ROOT:-C:/Users/Public/Mediastack}:/mediastack
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:9091/transmission/web/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # TVHeadend â€” TV streaming, EPG, recording backend (host network)
  # Docs: https://tvheadend.org/
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  tvheadend:
    <<: [*common, *no-ipv6]
    image: lscr.io/linuxserver/tvheadend:latest
    container_name: tvheadend
    environment:
      <<: *env-ls
    volumes:
      - ${CONFIG_ROOT:-./config}/tvheadend:/config
      - //VoltaireUn/Users/Public/Videos/Recordings:/recordings
      - ${MEDIASTACK_ROOT:-C:/Users/Public/Mediastack}:/mediastack
    ports:
      - "9981:9981"
      - "9982:9982"    # HTSP streaming port
    # Uncomment for physical DVB tuner:
    # devices:
    #   - /dev/dvb:/dev/dvb
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:9981/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s



  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Syncthing â€” Full file sync + ARM theming share
  # Docs: https://docs.syncthing.net/
  #
  # x64 role: sync full media library + expose a "jellyfin-theme" share
  # pointing at CONFIG_ROOT/jellyfin/web/ so ARM satellites pick up
  # theme changes automatically.
  #
  # To configure the theme share after first run:
  #   1. Open Syncthing UI: http://{CADDY_DOMAIN}:8384 (or syncthing.{domain})
  #   2. Add folder: CONFIG_ROOT/jellyfin/web/  â€” label it "jellyfin-theme"
  #   3. Share it with each ARM device ID
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  syncthing:
    <<: [*common, *no-ipv6]
    image: syncthing/syncthing:latest
    container_name: syncthing
    hostname: mediastack-x64                # Distinct device name in Syncthing UI
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${CONFIG_ROOT:-./config}/syncthing:/var/syncthing/config
      - ${MEDIA_ROOT:-./media}:/data/media
      - ${CONFIG_ROOT:-./config}/jellyfin/web:/data/jellyfin-theme  # theme share
      - ${MEDIASTACK_ROOT:-C:/Users/Public/Mediastack}:/mediastack
    ports:
      - "8384:8384"
      - "22000:22000"
      - "22000:22000/udp"
      - "21027:21027/udp"
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8384/rest/noauth/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:

networks:
  medianet:
    name: mediastack_default


