services:

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    labels:
      - "autoheal=true"

  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ${CONFIG_DIR:-./config}/caddy_data:/data
      - ${CONFIG_DIR:-./config}/caddy_config:/config
      - ./dashboard:/var/www/dashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "autoheal=true"

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-./config}/jellyfin:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "8096:8096"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "autoheal=true"

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: jellyseerr
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-./config}/jellyseerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped
    labels:
      - "autoheal=true"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-./config}/sonarr:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "8989:8989"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "autoheal=true"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-./config}/radarr:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "7878:7878"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "autoheal=true"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-./config}/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    labels:
      - "autoheal=true"

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-./config}/bazarr:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "6767:6767"
    restart: unless-stopped
    labels:
      - "autoheal=true"

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./transmission/config:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "9091:9091"
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
    labels:
      - "autoheal=true"

  mediastack-db:
    image: coleifer/sqlite-web
    container_name: mediastack-db
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
      - SQLITE_DATABASE=/config/mediastack_backup.db
    volumes:
      - ${CONFIG_DIR:-./config}/db-backup:/config
      - ${CONFIG_DIR:-./config}:/mediastack/config:ro
    restart: unless-stopped

  tvheadend:
    image: lscr.io/linuxserver/tvheadend:latest
    container_name: tvheadend
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_DIR:-./config}/tvheadend:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "9981:9981"
      - "9982:9982"
    restart: unless-stopped
    labels:
      - "autoheal=true"

  diun:
    image: crazymax/diun:latest
    container_name: diun
    command: serve
    volumes:
      - ${CONFIG_DIR:-./config}/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ:-America/New_York}
      - LOG_LEVEL=info
      - LOG_JSON=false
      - DIUN_WATCH_WORKERS=20
      - DIUN_WATCH_SCHEDULE=0 0 * * *
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
    ports:
      - "9090:9090"
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
      - HOMEPAGE_ALLOWED_HOSTS=*
    volumes:
      - ${CONFIG_DIR:-./config}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    labels:
      - "autoheal=true"

volumes:
  caddy_data:
  caddy_config:


